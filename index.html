<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Soma，一个安静的对话与创作空间。" />
    <title>Soma · 对话与创作</title>
    <link rel="icon" type="image/svg+xml" href="/soma.svg" />
    <script>
      // Apply the theme before first paint so system dark mode never flashes white.
      (function () {
        var mode = 'system'
        try {
          var saved = localStorage.getItem('soma-theme')
          if (saved === 'light' || saved === 'dark') mode = saved
        } catch (error) { /* Storage unavailable: fall back to the system setting. */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1c1c1c' : '#f6f6f6')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
